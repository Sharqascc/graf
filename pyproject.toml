[build-system]
requires = ["setuptools>=68,<82", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graf"
version = "0.1.0"
description = "Graph-based surrogate safety analysis pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  {name = "ASCC Sharq 786"}
]
keywords = ["traffic safety", "graph neural networks", "surrogate safety measures", "computer vision"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "numpy",
  "pandas",
  "scipy",
  "scikit-learn",
  "opencv-python",
  "pyyaml",
  "matplotlib",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-cov",
  # Pinned to match .pre-commit-config.yaml's ruff-pre-commit rev. A
  # mismatched local ruff reformats differently and the CI Ruff job
  # fails on files that passed locally. Bump both together.
  "ruff==0.16.4",
  "mypy",
  "pre-commit",
  "hypothesis",
  "deptry",
  "tox",
  "import-linter",
]
gpu = [
  "torch",
  "torchvision",
  "torchaudio",
  "torch-geometric",
]
detection = [
  "ultralytics",
]

[project.urls]
Homepage = "https://github.com/Sharqascc/graf"
Repository = "https://github.com/Sharqascc/graf.git"
Issues = "https://github.com/Sharqascc/graf/issues"
[project.scripts]
graf = "graf.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["graf*"]
namespaces = false


[tool.ruff]
extend-exclude = ["notebooks"]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
ignore = [
    "E501",
    "E402",
    "N802",
    "N803",
    "N806",
    "N816",
    "B905",
    "RUF022",
    "RUF046",
    "RUF059",
    "SIM102",
    "SIM105",
    "SIM108",
    "C414",
]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]
[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
disable_error_code = ["import-untyped", "no-any-return"]
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["tests/"]

[tool.deptry]
extend_exclude = ["notebooks", "docs", "data", ".github"]
known_first_party = ["graf"]

[tool.deptry.per_rule_ignores]
# Installed but never `import`-ed directly by project code:
#   ruff / mypy / pre-commit  -> CLI tools
#   pytest / pytest-cov       -> invoked via pytest, not imported as modules
#   torchvision / torchaudio  -> pulled alongside torch; used indirectly
#   jupyter                   -> notebook runtime, no module-level import
DEP002 = [
  "ruff",
  "mypy",
  "pre-commit",
  "deptry",
  "tox",
  "import-linter",
  "pytest",
  "pytest-cov",
  "torchvision",
  "torchaudio",
  "jupyter",
]

[tool.deptry.package_module_name_map]
# Map PyPI distribution name -> import module name for packages
# whose names differ. Without this, deptry wrongly flags DEP001
# when the package isn't installed in the scanning environment
# (which is the case in CI job 1, where only ruff + deptry are).
pyyaml = "yaml"
opencv-python = "cv2"
scikit-learn = "sklearn"

[tool.importlinter]
root_packages = ["graf"]

[[tool.importlinter.contracts]]
name = "data.schema is a leaf module"
type = "forbidden"
source_modules = ["graf.data.schema"]
forbidden_modules = [
  "graf.calibration",
  "graf.graph",
  "graf.models",
  "graf.ssm",
  "graf.training",
  "graf.trajectories",
  "graf.detection",
  "graf.tracking",
  "graf.visualization",
  "graf.evaluation",
]

[[tool.importlinter.contracts]]
name = "ssm is a primitive layer"
type = "forbidden"
source_modules = ["graf.ssm"]
forbidden_modules = [
  "graf.graph",
  "graf.models",
  "graf.training",
]

[[tool.importlinter.contracts]]
name = "calibration is a primitive layer"
type = "forbidden"
source_modules = ["graf.calibration"]
forbidden_modules = [
  "graf.graph",
  "graf.models",
  "graf.ssm",
  "graf.training",
]

[tool.pytest.ini_options]
# Consolidated from the former pytest.ini. tox and CI both read this.
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
  "hypothesis: property-based tests using Hypothesis",
]
