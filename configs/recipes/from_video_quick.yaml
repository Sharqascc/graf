# Quick end-to-end test: video -> graphs on ~1% of frames.
# Runs in ~2 minutes on CPU. Use from_video.yaml for the full video.

name: from_video_quick
description: Video -> detections -> tracks -> graphs (strided)

steps:
  - name: extract-frames
    cmd:
      - python
      - scripts/extract_frames.py
      - --video_path
      - data/raw/videos/mrc_intersection.mp4
      - --output_dir
      - data/interim/frames/from_video_quick
      - --stride
      - "50"

  - name: detect
    cmd:
      - python
      - scripts/run_detection.py
      - --frames_dir
      - data/interim/frames/from_video_quick/mrc_intersection
      - --output_dir
      - data/interim/detections/from_video_quick
      - --config
      - configs/detection/uvh26.yaml
      - --video-id
      - mrc_intersection
      - --imgsz
      - "960"

  - name: track
    cmd:
      - python
      - scripts/run_tracking.py
      - --detections
      - data/interim/detections/from_video_quick/detections.jsonl
      - --output_dir
      - data/interim/tracks/from_video_quick

  - name: build-trajectories
    cmd:
      - python
      - scripts/build_trajectories.py
      - --tracks
      - data/interim/tracks/from_video_quick/tracks.jsonl
      - --output
      - data/interim/trajectories/from_video_quick.json
      - --pixels_per_meter
      - "100.0"

  - name: build-graphs
    cmd:
      - python
      - scripts/build_graphs.py
      - --tracks
      - data/interim/tracks/from_video_quick/tracks.jsonl
      - --output_dir
      - data/processed/graphs/from_video_quick
      - --pixels_per_meter
      - "100.0"
      - --radius
      - "10.0"
