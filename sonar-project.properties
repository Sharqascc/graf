# SonarQube Cloud project configuration.
#
# Every property value must be on the same line as its key.
# A value on the following line parses as empty in .properties
# files and disables the property silently.
sonar.organization=sharqascc
sonar.projectKey=Sharqascc_graf
sonar.projectName=graf
sonar.sources=src,scripts
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Files excluded from analysis entirely. The Dockerfile and
# .dockerignore are verified by the '8 · Docker build + test' CI
# job, so Sonar lint on them is redundant.
sonar.exclusions=data/**,outputs/**,docs/paper/*.json,**/__pycache__/**,Dockerfile,.dockerignore

# Rule-scoped suppressions for rules whose default advice does not
# fit this project. The multicriteria key list must be on one line.
sonar.issue.ignore.multicriteria=pipbin_gha,pipbin_shell,lock_pyproject,pytrav_devcli

# githubactions:S8541 -- 'Omitting --only-binary :all: can lead to
# setup-script execution.' CI installs version-pinned deps from
# requirements/*.txt and the PyTorch CPU index.
sonar.issue.ignore.multicriteria.pipbin_gha.ruleKey=githubactions:S8541
sonar.issue.ignore.multicriteria.pipbin_gha.resourceKey=.github/workflows/*.yml

# shell:S8541 -- same rationale, applies to scripts/*.sh.
sonar.issue.ignore.multicriteria.pipbin_shell.ruleKey=shell:S8541
sonar.issue.ignore.multicriteria.pipbin_shell.resourceKey=scripts/*.sh

# text:S8565 -- 'lock file missing.' The repo commits
# requirements/lock.txt; SonarCloud only recognizes uv.lock,
# poetry.lock, pdm.lock, pylock.toml.
sonar.issue.ignore.multicriteria.lock_pyproject.ruleKey=text:S8565
sonar.issue.ignore.multicriteria.lock_pyproject.resourceKey=pyproject.toml

# pythonsecurity:S8707 -- 'Path Traversal via CLI arguments.' All
# flagged call sites are dev/CI-only scripts under scripts/.
sonar.issue.ignore.multicriteria.pytrav_devcli.ruleKey=pythonsecurity:S8707
sonar.issue.ignore.multicriteria.pytrav_devcli.resourceKey=scripts/**
