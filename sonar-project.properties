# SonarQube Cloud project configuration.
# Replace both placeholders below with the values SonarQube Cloud
# shows you when you import this repository.
sonar.organization=sharqascc
sonar.projectKey=Sharqascc_graf
sonar.projectName=graf

sonar.sources=src,scripts
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Exclude generated and vendored content from analysis.
sonar.exclusions=data/**,outputs/**,docs/paper/*.json,**/__pycache__/**

# Coverage: the repo produces coverage.xml from pytest-cov; wire it
# in by adding a job step that runs pytest --cov-report=xml before
# the scan, then uncomment:
# sonar.python.coverage.reportPaths=coverage.xml
