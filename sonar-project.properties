# SonarQube Cloud project configuration.
#
# Every property value must be on the same line as its key.
# In .properties files a value on the following line parses as
# empty and silently disables the property.
sonar.organization=sharqascc
sonar.projectKey=Sharqascc_graf
sonar.projectName=graf
sonar.sources=src,scripts
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Files excluded from analysis.
# Dockerfile has no extension; Sonar's glob matcher needs the **/
# prefix on extension-less filenames. Source:
# https://community.sonarsource.com/t/sonar-exclusions-not-excluding-docker-files/177987
sonar.exclusions=data/**,outputs/**,docs/paper/*.json,**/__pycache__/**,**/Dockerfile,**/.dockerignore

# Rule-scoped suppressions. Keys must be on one comma-separated
# line; .ruleKey and .resourceKey entries follow individually.
sonar.issue.ignore.multicriteria=dockerpip1,dockerpip2,pipbin_gha,pipbin_shell,lock_pyproject,pytrav_devcli

# docker:S8541 -- 'Omitting --only-binary :all: can lead to setup-
# script execution.' Our Dockerfile installs from requirements/*.txt
# (pinned) and the PyTorch CPU index; --only-binary :all: rejects
# the sdists several torch transitive deps ship as. Pattern per
# TruePPM production config: resourceKey=**/*Dockerfile.
sonar.issue.ignore.multicriteria.dockerpip1.ruleKey=docker:S8541
sonar.issue.ignore.multicriteria.dockerpip1.resourceKey=**/*Dockerfile

# docker:S8544 -- 'dependencies without locking.' Pinning is in
# requirements/lock.txt, which SonarCloud does not recognize.
sonar.issue.ignore.multicriteria.dockerpip2.ruleKey=docker:S8544
sonar.issue.ignore.multicriteria.dockerpip2.resourceKey=**/*Dockerfile

# githubactions:S8541 -- same rationale, applies to CI workflows.
sonar.issue.ignore.multicriteria.pipbin_gha.ruleKey=githubactions:S8541
sonar.issue.ignore.multicriteria.pipbin_gha.resourceKey=.github/workflows/*.yml

# shell:S8541 -- same rationale, applies to scripts/*.sh.
sonar.issue.ignore.multicriteria.pipbin_shell.ruleKey=shell:S8541
sonar.issue.ignore.multicriteria.pipbin_shell.resourceKey=scripts/*.sh

# text:S8565 -- 'lock file missing.' False positive: see above.
sonar.issue.ignore.multicriteria.lock_pyproject.ruleKey=text:S8565
sonar.issue.ignore.multicriteria.lock_pyproject.resourceKey=pyproject.toml

# pythonsecurity:S8707 -- path traversal on dev/CI CLI scripts.
sonar.issue.ignore.multicriteria.pytrav_devcli.ruleKey=pythonsecurity:S8707
sonar.issue.ignore.multicriteria.pytrav_devcli.resourceKey=scripts/**
