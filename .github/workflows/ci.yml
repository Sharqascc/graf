name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  lint:
    name: "1 · Ruff"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: python -m pip install --upgrade pip pre-commit
      # CI runs the same pre-commit hooks a developer runs locally.
      # This is deliberate: mypy results depend on which packages are
      # installed (an isolated env resolves numpy/pandas to Any; an env
      # with those packages installed sees real stubs and reports
      # different errors). Replicating pre-commit's per-hook isolated
      # environments via raw CLI invocations would drift. Running
      # pre-commit itself cannot.
      - run: pre-commit run --all-files --show-diff-on-failure

  unit-tests:
    name: "2 · Unit tests"
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/base.txt -r requirements/dev.txt
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install torch-geometric
          pip install pytest-cov
      - name: Run unit tests
        run: |
          pytest -q --cov=src --cov-report=term-missing \
            --ignore=tests/test_property_based.py

  property-tests:
    name: "3 · Property tests (Hypothesis)"
    needs: unit-tests
    runs-on: ubuntu-latest
    env:
      HYPOTHESIS_PROFILE: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/base.txt -r requirements/dev.txt
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install torch-geometric
      - name: Run property tests
        run: pytest -q tests/test_property_based.py -m hypothesis
