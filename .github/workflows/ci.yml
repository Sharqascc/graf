name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  lint:
    name: "1 · Ruff"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: python -m pip install --upgrade pip pre-commit
      # CI runs the same pre-commit hooks a developer runs locally. This
      # is deliberate: mypy results depend on which packages are
      # installed (an isolated env resolves numpy/pandas to Any; an env
      # with those packages installed sees real stubs and reports
      # different errors). Replicating pre-commit's per-hook isolated
      # environments with raw CLI invocations would drift; running
      # pre-commit itself cannot.
      - run: pre-commit run --all-files --show-diff-on-failure

  unit-tests:
    name: "2 · Unit tests"
    # Runs in parallel with lint: a lint failure should not prevent
    # tests from reporting. Previously `needs: lint` meant a docs
    # PR that tripped a hygiene hook skipped every test job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Cache pip wheels
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements/*.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/base.txt -r requirements/dev.txt
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install torch-geometric
          pip install pytest-cov
      - name: Run unit tests
        run: |
          pytest -q --cov=src --cov=scripts --cov-report=term-missing \
            --cov-fail-under=65 \
            -m "not hypothesis"

  property-tests:
    name: "3 · Property tests (Hypothesis)"
    # Runs independently of unit tests: a unit-test failure should not
    # hide whether the property suite passes or fails.
    runs-on: ubuntu-latest
    env:
      HYPOTHESIS_PROFILE: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Cache pip wheels
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements/*.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/base.txt -r requirements/dev.txt
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install torch-geometric
      - name: Run property tests
        run: pytest -q -m hypothesis

  invariants:
    name: "4 · Invariants (pre-push suite)"
    # These tests were previously declared in .pre-commit-config.yaml with
    # `stages: [pre-push]`, which excluded them from CI: `pre-commit run
    # --all-files` uses the default `pre-commit` stage. The sharpest
    # checks (determinism, data-leakage, input-boundaries, metamorphic,
    # differential) therefore ran on nobody unless the developer had run
    # `pre-commit install --hook-type pre-push` locally. This job runs
    # them explicitly on every push and PR.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Cache pip wheels
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements/*.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/base.txt -r requirements/dev.txt
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install torch-geometric
      - name: Determinism, leakage, input-boundary checks
        run: |
          pytest -q tests/test_determinism.py tests/test_data_leakage.py \
            tests/test_input_boundaries.py
      - name: Metamorphic and differential checks
        run: |
          pytest -q tests/test_metamorphic.py tests/test_differential.py

  manuscript:
    name: "5 · Manuscript build"
    # Fails if docs/paper/manuscript.md is out of sync with the section
    # files. Prevents hand-edits to the compiled file.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify manuscript.md is up to date
        run: python scripts/build_manuscript.py --check

  import-smoke:
    name: "7 · Import smoke"
    # Imports every module under src/ and scripts/. Catches syntax
    # errors, missing imports, references to deleted modules, and
    # missing dependencies — the class of error a test suite cannot
    # see when the failing file is never touched by a test.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Cache pip wheels
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements/*.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/base.txt -r requirements/dev.txt
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install torch-geometric
      - name: Import every module
        run: PYTHONPATH=src python scripts/import_smoke.py

  docker:
    name: "8 · Docker build + test"
    # Builds the reproducibility image and runs the same test
    # selection CI uses, inside the container. Keeps the Dockerfile
    # honest: if it ever stops building or starts failing tests,
    # this job goes red before anyone tries to publish it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          load: true
          tags: graf:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run tests inside the image
        run: |
          docker run --rm graf:ci python -m pytest -q \
            --cov=src --cov=scripts --cov-fail-under=65 \
            -m "not hypothesis"

  dependency-review:
    name: "6 · Dependency review"
    # Advisory: scans the PR's dependency diff for known CVEs via GitHub's
    # dependency graph. continue-on-error while we tune; promote to
    # blocking once we have a baseline.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        continue-on-error: true
