name: Nightly Deep Verification

# Scheduled off the top of the hour; GitHub's cron is UTC.
on:
  schedule:
    - cron: "34 2 * * *"
  workflow_dispatch:  # allow manual trigger

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  deep-property-tests:
    name: Deep property tests (Hypothesis)
    runs-on: ubuntu-latest
    env:
      HYPOTHESIS_PROFILE: nightly
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/base.txt -r requirements/dev.txt
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install torch-geometric
      - name: Deep property testing
        run: pytest -q tests/test_property_based.py -m hypothesis

  mutation-diagnostic:
    name: Mutation diagnostic (ttc.py)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/base.txt -r requirements/dev.txt
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install torch-geometric
      # Two failure modes are treated differently:
      #   * mutation survivors  -> report only, never fail the job. A
      #     weekly survivor count is a review artifact, not a gate.
      #   * mutation harness crash -> fail the job. If scripts/mutate_ttc.py
      #     itself is broken, a silently-green nightly hides infrastructure
      #     failure behind a "no survivors" report.
      - name: Run mutation harness
        run: |
          set +e
          python scripts/mutate_ttc.py --out /tmp/mutation_testing.md
          rc=$?
          set -e
          if [ "$rc" -ge 2 ]; then
            echo "mutation harness failed with exit code $rc"
            exit 1
          fi
          cat /tmp/mutation_testing.md
      - name: Upload mutation report
        uses: actions/upload-artifact@v6
        with:
          name: mutation-report-${{ github.run_id }}
          path: /tmp/mutation_testing.md
          retention-days: 30
