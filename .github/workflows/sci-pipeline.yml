name: SCI second-site tracking

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: >-
          Direct download URL for the SCI video. If blank, uses the
          SCI_VIDEO_URL repository secret.
        required: false
        default: ""

concurrency:
  group: sci-pipeline-${{ github.ref }}
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  sci-tracking:
    name: Detect and track SCI
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Cache pip wheels
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements/*.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/base.txt -r requirements/dev.txt
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install ultralytics
          pip install -e . --no-deps

      - name: Fetch UVH-26 detector weights
        run: |
          python scripts/fetch_detector.py \
            --model YOLOv11-S \
            --output-dir data/models

      - name: Download SCI video
        env:
          VIDEO_URL_INPUT: ${{ inputs.video_url }}
          VIDEO_URL_SECRET: ${{ secrets.SCI_VIDEO_URL }}
        run: |
          set -euo pipefail
          URL="${VIDEO_URL_INPUT:-${VIDEO_URL_SECRET:-}}"
          if [ -z "$URL" ]; then
            echo "::error::No video URL. Provide video_url in the workflow_dispatch form, or set the SCI_VIDEO_URL repository secret."
            exit 1
          fi
          mkdir -p data/raw/videos
          curl -fL --retry 3 --retry-delay 5 \
            --output data/raw/videos/sci.mp4 "$URL"
          echo "Downloaded $(stat -c%s data/raw/videos/sci.mp4) bytes"

      - name: Run SCI recipe
        run: |
          graf reproduce configs/recipes/sci_v1.yaml

      - name: Print summary
        if: always()
        run: |
          if [ -f data/interim/tracks/sci/summary.json ]; then
            echo "═══════════════════════════════════════════════════════════"
            echo "TRACKING QUALITY SUMMARY"
            echo "═══════════════════════════════════════════════════════════"
            cat data/interim/tracks/sci/summary.json
          else
            echo "(no summary.json produced)"
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sci-tracks-${{ github.run_id }}
          path: |
            data/interim/detections/sci/detections.jsonl
            data/interim/tracks/sci/tracks.jsonl
            data/interim/tracks/sci/summary.json
          if-no-files-found: warn
          retention-days: 30
