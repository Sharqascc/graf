name: SCI second-site tracking

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: >-
          Optional. If blank, downloads sci.mp4 from the sci-v1 release
          in this repository. Set only to fetch the video from a
          different location.
        required: false
        default: ""

concurrency:
  group: sci-pipeline-${{ github.ref }}
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  sci-tracking:
    name: Detect and track SCI
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Cache pip wheels
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements/*.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/base.txt -r requirements/dev.txt
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install ultralytics
          pip install -e . --no-deps

      - name: Fetch UVH-26 detector weights
        run: |
          python scripts/fetch_detector.py \
            --model YOLOv11-S \
            --output-dir data/models

      - name: Download SCI video
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VIDEO_URL_INPUT: ${{ inputs.video_url }}
          VIDEO_URL_SECRET: ${{ secrets.SCI_VIDEO_URL }}
        run: |
          set -euo pipefail
          mkdir -p data/raw/videos

          # Preferred path: the video is a release asset in this repo, so
          # `gh release download` handles auth (via GITHUB_TOKEN) and
          # retries. Falls back to a plain curl for the case where
          # SCI_VIDEO_URL points somewhere else entirely.
          if [ -n "${VIDEO_URL_INPUT:-}" ] || [ -n "${VIDEO_URL_SECRET:-}" ]; then
            URL="${VIDEO_URL_INPUT:-${VIDEO_URL_SECRET}}"
            echo "downloading from URL"
            curl -fL --retry 3 --retry-delay 5 \
              --output data/raw/videos/sci.mp4 "$URL"
          else
            echo "downloading sci.mp4 from release sci-v1"
            gh release download sci-v1 \
              --pattern sci.mp4 \
              --dir data/raw/videos \
              --clobber
            # gh names the file after the asset, which is already sci.mp4
          fi

          ls -l data/raw/videos/
          echo "Downloaded $(stat -c%s data/raw/videos/sci.mp4) bytes"

      - name: Run SCI recipe
        run: |
          graf reproduce configs/recipes/sci_v1.yaml

      - name: Print summary
        if: always()
        run: |
          if [ -f data/interim/tracks/sci/summary.json ]; then
            echo "═══════════════════════════════════════════════════════════"
            echo "TRACKING QUALITY SUMMARY"
            echo "═══════════════════════════════════════════════════════════"
            cat data/interim/tracks/sci/summary.json
          else
            echo "(no summary.json produced)"
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sci-tracks-${{ github.run_id }}
          path: |
            data/interim/detections/sci/detections.jsonl
            data/interim/tracks/sci/tracks.jsonl
            data/interim/tracks/sci/summary.json
          if-no-files-found: warn
          retention-days: 30
