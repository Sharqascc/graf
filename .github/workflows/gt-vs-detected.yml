name: GT vs Detected comparison

# Manual trigger only. This is a paper-support experiment, not a PR gate.
# Result: comparison.json + comparison.md as workflow artifacts.
on:
  workflow_dispatch:
    inputs:
      clip:
        description: "Clip name"
        required: true
        default: VNTraffic
        type: choice
        options:
          - VNTraffic
          - AICC22-Custom
      imgsz:
        description: "Detection image size (640 for CI speed; 1280 for paper-quality)"
        required: true
        default: '640'
        type: choice
        options:
          - '640'
          - '1280'

jobs:
  compare:
    name: "GT vs detected — ${{ inputs.clip }}"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Cache pip wheels
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements/*.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/base.txt -r requirements/dev.txt
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install torch-geometric
          pip install ultralytics
      - name: Fetch VNTraffic dataset
        run: python scripts/fetch_vntraffic.py --data-root data/external/vntraffic
      - name: Prepare GT tracks and homography
        run: python scripts/prepare_vntraffic.py --dataset-root data/external/vntraffic
      - name: Run comparison
        run: |
          python scripts/compare_gt_vs_detected.py \
            --video data/external/vntraffic/${{ inputs.clip }}/${{ inputs.clip }}_Original-video.mp4 \
            --gt-txt data/external/vntraffic/${{ inputs.clip }}/${{ inputs.clip }}_GroundTruth.txt \
            --homography-config data/raw/vntraffic_homography.yaml \
            --output-dir outputs/gt_vs_detected \
            --detection-imgsz ${{ inputs.imgsz }}
      - name: Upload comparison artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gt-vs-detected-${{ inputs.clip }}
          path: outputs/gt_vs_detected/comparison.*
          retention-days: 90
