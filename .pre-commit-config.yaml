repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-ast
      - id: debug-statements
      - id: check-added-large-files
        args: ["--maxkb=1000"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.1
    hooks:
      - id: mypy
        additional_dependencies: [types-PyYAML]
        exclude: ^(tests/|notebooks/)

  - repo: local
    hooks:
      - id: import-linter
        name: import-linter (architecture)
        # PYTHONPATH=src so import-linter can resolve the graf package
        # without the project being pip-installed in the hook's isolated
        # env. `env` is used as the executable because pre-commit
        # invokes `entry` via execvp, not a shell.
        entry: env PYTHONPATH=src lint-imports
        language: python
        additional_dependencies: [import-linter]
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: deptry
        name: deptry (dependency hygiene)
        # language: python with additional_dependencies makes pre-commit
        # install deptry into an isolated env. language: system would
        # require deptry on PATH, which is true on a developer machine
        # after `pip install -e .[dev]` but not in a bare CI runner.
        entry: deptry .
        language: python
        additional_dependencies: [deptry]
        pass_filenames: false
        always_run: true

      - id: pytest-full
        name: pytest (full unit suite + coverage floor)
        # ~105 s. Runs the exact selection CI's `2 · Unit tests` job runs:
        # everything under tests/ except the Hypothesis property file,
        # with the same coverage floor (65%). Any failure — a failing
        # test OR a coverage drop below the floor — aborts the push in
        # Colab, so the GitHub PR is green first try.
        #
        # Previously this ran without coverage, which meant a passing
        # suite that dropped coverage under 65% pushed cleanly and only
        # failed in CI ~5 minutes later. Adding coverage closes that one
        # remaining class of late failure. Cost: +27 s per push.
        #
        # Bypassable via `git push --no-verify`. This is an early-warning
        # layer, not a security boundary. Server-side enforcement is
        # GitHub's job (see docs/reproducibility.md for the current
        # private-repo caveat).
        entry: >-
          python -m pytest -q
          --cov=src --cov=scripts --cov-report=term-missing
          --cov-fail-under=65
          --ignore=tests/test_property_based.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
