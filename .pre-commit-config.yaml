repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-ast
      - id: debug-statements
      - id: check-added-large-files
        args: ["--maxkb=1000"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.1
    hooks:
      - id: mypy
        additional_dependencies: [types-PyYAML]
        exclude: ^(tests/|notebooks/)

  - repo: local
    hooks:
      - id: deptry
        name: deptry (dependency hygiene)
        # language: python with additional_dependencies makes pre-commit
        # install deptry into an isolated env. language: system would
        # require deptry on PATH, which is true on a developer machine
        # after `pip install -e .[dev]` but not in a bare CI runner.
        entry: deptry .
        language: python
        additional_dependencies: [deptry]
        pass_filenames: false
        always_run: true
