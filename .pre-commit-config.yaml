repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-ast
      - id: debug-statements
      - id: check-added-large-files
        args: ["--maxkb=1000"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.1
    hooks:
      - id: mypy
        additional_dependencies: [types-PyYAML]
        exclude: ^(tests/|notebooks/)

  - repo: local
    hooks:
      - id: import-linter
        name: import-linter (architecture)
        # PYTHONPATH=src so import-linter can resolve the graf package
        # without the project being pip-installed in the hook's isolated
        # env. `env` is used as the executable because pre-commit
        # invokes `entry` via execvp, not a shell.
        entry: env PYTHONPATH=src lint-imports
        language: python
        additional_dependencies: [import-linter]
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: deptry
        name: deptry (dependency hygiene)
        # language: python with additional_dependencies makes pre-commit
        # install deptry into an isolated env. language: system would
        # require deptry on PATH, which is true on a developer machine
        # after `pip install -e .[dev]` but not in a bare CI runner.
        entry: deptry .
        language: python
        additional_dependencies: [deptry]
        pass_filenames: false
        always_run: true

      - id: pytest-full
        name: pytest (full unit suite, CI selection)
        # ~78 s. Runs the same selection as CI's `2 · Unit tests` job
        # minus coverage: everything under tests/ except the Hypothesis
        # property file. Catches code regressions in Colab before the
        # push leaves the machine, so the GitHub PR is more likely to be
        # green first try.
        #
        # This replaced two narrower pre-push hooks (determinism +
        # leakage + input-boundaries; metamorphic + differential) that
        # together ran ~43 tests in ~12 s. The full suite supersedes them
        # because it includes those files and 540 more. Running both
        # would double-run the safety files for no benefit.
        #
        # Excluded on purpose:
        #   - coverage (CI's job; doubles the wall time here)
        #   - tests/test_property_based.py (48 Hypothesis tests; CI + nightly)
        #   - mutation testing (nightly only)
        #   - manuscript build check (CI only)
        #
        # Bypassable via `git push --no-verify`. This is an early-warning
        # layer, not a security boundary. Server-side enforcement is
        # GitHub's job (see docs/reproducibility.md for the current
        # private-repo caveat).
        entry: python -m pytest -q --ignore=tests/test_property_based.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
