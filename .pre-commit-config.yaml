repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-ast
      - id: debug-statements
      - id: check-added-large-files
        args: ["--maxkb=1000"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.1
    hooks:
      - id: mypy
        additional_dependencies: [types-PyYAML]
        exclude: ^(tests/|notebooks/)

  - repo: local
    hooks:
      - id: deptry
        name: deptry (dependency hygiene)
        # language: python with additional_dependencies makes pre-commit
        # install deptry into an isolated env. language: system would
        # require deptry on PATH, which is true on a developer machine
        # after `pip install -e .[dev]` but not in a bare CI runner.
        entry: deptry .
        language: python
        additional_dependencies: [deptry]
        pass_filenames: false
        always_run: true

      - id: pytest-fast
        name: pytest (determinism + data-leakage)
        # ~0.4 s. Determinism and data-leakage invariants are cheap and
        # catch the class of bug that hides behind randomness. Running
        # on every push, not every commit, keeps commit latency low.
        entry: python -m pytest -q tests/test_determinism.py tests/test_data_leakage.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: pytest-invariants
        name: pytest (metamorphic + differential)
        # ~10 s. Metamorphic invariance (translation, rotation) and
        # closed-form-vs-naive differential checks. Slower than the fast
        # hooks above, so they run at push time rather than commit time.
        # These two suites found the three SSM bugs fixed in PR #24.
        entry: python -m pytest -q tests/test_metamorphic.py tests/test_differential.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
