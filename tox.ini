[tox]
envlist = lint,unit,property
skip_missing_interpreters = true

[testenv]
# Editable install of the project plus its dev extras, so the
# venv mirrors what a local developer has. CI installs the same
# deps via requirements/*.txt — see .github/workflows/ci.yml.
package = editable
extras = dev

[testenv:lint]
description = Ruff + deptry (mirrors CI job 1)
package = skip
deps =
    ruff==0.16.4
    deptry
commands =
    ruff check .
    ruff format --check .
    deptry .

[testenv:unit]
description = Unit tests (mirrors CI job 2)
# torch needs the CPU-only wheel index; tox deps do not support
# --index-url, so install it in a pre-command instead.
commands_pre =
    python -m pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
    python -m pip install torch-geometric
commands =
    pytest -q --cov=src --cov-report=term-missing --ignore=tests/test_property_based.py

[testenv:property]
description = Property tests under the ci Hypothesis profile (mirrors CI job 3)
setenv =
    HYPOTHESIS_PROFILE = ci
commands_pre =
    python -m pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
    python -m pip install torch-geometric
commands =
    pytest -q tests/test_property_based.py -m hypothesis
